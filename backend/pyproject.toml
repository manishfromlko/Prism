[project]
name = "project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.100.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langsmith>=0.4.0",
    "mlflow-skinny>=3.14.0",
    "openai>=1.0.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "rapidfuzz>=3.14.5",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
]

[dependency-groups]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
