version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: kubeflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: UTC
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubeflow-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - INGESTION_CATALOG_PATH=/data/catalog.json
    depends_on:
      - qdrant
    volumes:
      - ./src:/app/src:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./dataset:/data:ro

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: kubeflow-webapp
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  qdrant_storage:
