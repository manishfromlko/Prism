services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: kubeflow-mlflow
    ports:
      - "5001:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost,localhost:5001,127.0.0.1,127.0.0.1:5001,mlflow,mlflow:5000,kubeflow-mlflow,kubeflow-mlflow:5000
      - --cors-allowed-origins
      - http://localhost:3000,http://localhost:5001,http://127.0.0.1:3000,http://127.0.0.1:5001
    volumes:
      - mlflow_data:/mlflow

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: kubeflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: UTC
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubeflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=kubeflow_artifacts
      - MLFLOW_TRACING=${MLFLOW_TRACING:-true}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-rag-chatbot-legacy}
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_DIMENSION=1536
      - INGESTION_CATALOG_PATH=/data/.ingestion/ingestion_catalog.json
    depends_on:
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - ./src:/app/src:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./dataset:/data
      - ./platform_documents:/app/platform_documents:ro
      - ./prompts:/app/prompts:ro

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        PYTHON_API_URL: http://backend:8000
    container_name: kubeflow-webapp
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - PYTHON_API_URL=http://backend:8000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

volumes:
  mlflow_data:
  qdrant_storage:
